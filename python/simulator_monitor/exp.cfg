[SYSTEM]
# Root directory where experiment recordings will be saved
output_root_dir = ./records

[CAMERAS]
# USB Camera IDs/Indices (comma-separated, up to 4 cameras)
camera_ids = 0, 1, 2, 3
fps = 30
width = 640
height = 480
# FourCC codec for .avi recording (e.g. XVID, MJPG)
codec = XVID
# If true, disconnected cameras will display a centered 'no camera' black screen
mock_if_missing = true

[SUBJECT_DISPLAY]
# Resolution for subject stimulus window
width = 1920
height = 1080
fullscreen = false
scenario_dir = ./scenario
scenario_file = default.scenario

[DAQ]
# Advantech USB-4750 Device description
device_description = USB-4750,BID#0
profile_path = 
port = 0
channel = 0
poll_interval_ms = 10
# mock_mode options: 'auto' (use mock if driver/device unavailable), 'true', 'false'
mock_mode = auto

[SOUND]
# Audio file for handle switch feedback (.wav, .mp3)
sound_file = assets/beep.wav
# Enable sound feedback by default
sound_feedback = true

[EYETRACKER]
# Pupil Labs Neon automatic network discovery
auto_discover = true
device_address = 
device_port = 8080
search_timeout_sec = 2.0
