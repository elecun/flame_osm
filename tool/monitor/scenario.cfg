[video]
width = 1920
height = 1080
fps = 30
# Supported formats: mp4 (mp4v) or avi (MJPG)
format = avi
output_dir = takes
# Background color in BGR
background_bgr = 0, 0, 0

[take_1]
enabled = true
radius = 60
# Circle color in BGR (green = 0, 255, 0)
color_bgr = 0, 255, 0

# Step durations in seconds
wait_center_1_sec = 1.0
move_to_top_left_sec = 2.0
wait_top_left_sec = 1.0
move_to_bottom_left_sec = 2.0
wait_bottom_left_sec = 1.0
move_to_bottom_right_sec = 2.0
wait_bottom_right_sec = 1.0
move_to_top_right_sec = 2.0
wait_top_right_sec = 1.0
move_to_center_sec = 2.0
wait_center_2_sec = 1.0

[take_2]
enabled = true
radius = 60
# Circle color in BGR (green = 0, 255, 0)
color_bgr = 0, 255, 0
# Interval between appearances (blank screen) in seconds
interval_sec = 2.0
# Duration the circle stays visible in seconds
display_sec = 0.5
# Number of random appearances
repeat_count = 6
# Optional integer seed for reproducible random positions (leave empty for random)
random_seed =

[take_3]
enabled = true
radius = 60
# Candidate circle colors in BGR (green = 0, 255, 0; yellow = 0, 255, 255)
green_bgr = 0, 255, 0
yellow_bgr = 0, 255, 255
# Interval between appearances (blank screen) in seconds
interval_sec = 2.0
# Duration the circle stays visible in seconds
display_sec = 0.5
# Number of random appearances
repeat_count = 10
# Optional integer seed for reproducible uniform random sampling (leave empty for random)
random_seed =
