[display]
# Monitor selection: auto detects left (1920x1080) as subject and right/primary (2560x1440) as main.
# Set explicit 0-based screen indices to override auto-detection, or leave as auto.
main_monitor = auto
subject_monitor = auto
subject_width = 1920
subject_height = 1080
subject_fullscreen = true

[cameras]
max_cameras = 4
# Camera device indices to use, e.g. [0, 1, 2] or [2, 6] (use 'auto' to auto-detect)
device_indices = [0, 2, 4, 6]
width = 1280
height = 720
fps = 30
fourcc = MJPG
# Preview scale factor per axis (0.5 => 1/2 width x 1/2 height = 1/4 area; recording stays original size)
preview_scale = 0.3

[switch]
# Advantech USB-4750 DAQNavi device description
device = USB-4750,BID#0
# Isolated Digital Input channel index (IDI0 = 0)
channel = 0
# Polling interval in milliseconds
poll_interval_ms = 5
# Active low: button pressed -> raw 0 -> logged as 1; released -> raw 1 -> logged as 0
active_low = true

[eyetracker]
# Pupil Labs Neon IP address or subnet prefix (default: 192.168.0.18)
ip = 192.168.0.18
port = 8080
discover_timeout_sec = 5.0

[scenario]
# Directory containing stimulus videos (relative to monitor directory or absolute)
directory = scenario
# Video filename inside the scenario directory to preload on startup
video_file = scenario_1.mp4
# Audio output device name or ID substring (e.g. JBL Bar 2.1; 'default' uses system default)
audio_device = default

[recording]
# Root directory for recorded sessions
output_dir = record
# Default subject name pre-filled in the UI
default_subject = subject_01
